name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - 'docs/**'
      - 'pics/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure test tools are available
        run: |
          missing=()
          for tool in jq curl shellcheck mawk gawk; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          command -v flock >/dev/null || missing+=(util-linux)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Check Bash syntax and ShellCheck
        id: static
        run: bash tests/check.sh

      - name: Test with mawk
        run: bash tests/test_suite.sh mawk

      - name: Test with gawk
        if: ${{ !cancelled() && steps.static.outcome == 'success' }}
        run: bash tests/test_suite.sh gawk

      - name: Build and smoke-test the install bundle
        run: |
          bundle="$RUNNER_TEMP/ipqa.tar.gz"
          bash scripts/package.sh "$bundle"
          bash tests/test_install_bundle.sh "$bundle"
