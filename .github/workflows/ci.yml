name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Syntax & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl cron shellcheck

      - name: Run ShellCheck static analysis
        run: |
          shellcheck -S warning -e SC2181,SC1090,SC1091,SC2086 install.sh ipqa.sh tests/test_suite.sh

      - name: Verify Bash syntax
        run: |
          bash -n install.sh
          bash -n ipqa.sh
          bash -n tests/test_suite.sh

      - name: Run regression test suite
        run: |
          chmod +x tests/test_suite.sh
          ./tests/test_suite.sh
